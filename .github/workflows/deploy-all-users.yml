name: Deploy All Users

# Dispara manualmente ou por push na branch main
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

# Um deploy em massa por vez; push novo espera o anterior terminar
concurrency:
  group: deploy-all-users
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3️⃣ Dependências do app Next
      - name: Install dependencies (Next app)
        working-directory: ./apps/ecommerce
        run: npm ci

      # 4️⃣ Dependências do orchestrator (scripts)
      - name: Install dependencies (orchestrator)
        working-directory: ./scripts
        run: npm ci

      # 5️⃣ Wrangler (Cloudflare)
      - name: Install Wrangler
        run: npm install -g wrangler

      # 6️⃣ Deploy para todos os usuários
      - name: Deploy all users
        env:
          CP_ACCOUNT_ID: ${{ secrets.CP_ACCOUNT_ID }}
          CP_API_TOKEN: ${{ secrets.CP_API_TOKEN }}
          CP_DB_ID: ${{ secrets.CP_DB_ID }}
          CP_DOMAIN: ${{ secrets.CP_DOMAIN }}
          VN_PUBLIC_LICENCE: ${{ secrets.VN_PUBLIC_LICENCE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          
        run: node scripts/deploy-all-users.js